# /etc/nginx/sites-available/psk-feeds
# Замените feeds.example.ru на свой домен, сертификат: certbot --nginx -d feeds.example.ru

server {
    listen 80;
    server_name feeds.example.ru;
    # Яндекс скачивает картинки и фиды по 80 и 443, редирект на HTTPS он отрабатывает
    location / { return 301 https://$host$request_uri; }
    location /.well-known/acme-challenge/ { root /var/www/html; }
}

server {
    listen 443 ssl;
    server_name feeds.example.ru;

    ssl_certificate     /etc/letsencrypt/live/feeds.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feeds.example.ru/privkey.pem;

    # Вариант 1: статикой из папки docs (быстрее, генерация по cron или в контейнере)
    root /opt/psk-agency-feeds/docs;
    autoindex off;

    location /feeds/ {
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }
    location /plans/ {
        expires 7d;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
    }
}
