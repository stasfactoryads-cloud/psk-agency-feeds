# Конфигурация генератора фидов ГК «ПСК» для агентств недвижимости.
# Формат: YRL, техтребования Яндекс Недвижимости (продажа квартир в новостройках).
# После правки конфига сервис подхватывает изменения при следующей генерации.

[general]
# Публичный адрес фидов и JPG-планировок (хостинг REG.RU, папка /feed-evel/).
# Яндекс скачивает картинки по этому адресу, он должен быть доступен по 80/443.
public_base_url = "https://feedhub.realty/feed-evel"
output_dir = "docs"            # публикуемая папка: GitHub Pages отдает ее как сайт
cache_dir = "cache"            # служебные файлы: даты первого появления лотов (коммитятся)
api_base = "https://psk-info.ru/api"
site_url = "https://psk-info.ru"
refresh_minutes = 60           # период перегенерации в режиме serve (на своем сервере)
image_size = 1200              # длинная сторона планировки в пикселях
api_workers = 8                # параллельных запросов к карточкам лотов

# Старые ссылки feeds/<агентство>.xml
# (до разделения по ЖК) продолжают отдавать фид этого ЖК.
legacy_project = "optimist"

# ── ЖК ─────────────────────────────────────────────────────────────────────
# Каждый ЖК дает отдельный фид для каждого агентства:
#   <public_base_url>/feeds/<агентство>/<key>.xml
# ID берутся из каталога новостроек Яндекса: https://realty.yandex.ru/newbuildings.tsv
#   yandex_building_id: 3-й столбец (ЖК), yandex_house_id: 7-й столбец (корпус).
# house_ids: если у корпусов разные ID в каталоге, номер корпуса в API -> ID.
# Общие поля:
#   deal_status: "первичная продажа"; include_statuses: какие статусы лотов брать
#   render_count: сколько рендеров ЖК добавлять к лоту
#   show_discount: true = две цены: <price><value> старая цена без скидки,
#                  <price><discount><final-price> цена со скидкой (Яндекс покажет обе);
#                  false = только фактическая цена, скидка упоминается в описании
#   renovation: отделка из API сайта -> допустимое значение <renovation> Яндекса

[[project]]
key = "optimist"
api_id = 45
name = "Оптимист"
yandex_building_id = "4895327"
yandex_house_id = "4895353"
building_type = "монолит"
building_section = "корпус {building}"
deal_status = "первичная продажа"
include_statuses = ["Свободно"]
render_count = 6
show_discount = true
[project.renovation]
"Предчистовая" = "предчистовая"
"С отделкой" = "под ключ"

