# ── Страница со ссылками ──────────────────────────────────────────────────
# Эти данные показываются на главной странице и добавляются в текст,
# который копируется кнопкой «Скопировать все ссылки».
[portal]
developer = "Петербургская строительная компания"
site = "https://psk-info.ru"
phone = "+7 (812) 210-26-76"
manager = "Эвелина Петрова"
manager_role = "руководитель отдела"
support_bot = "@pskit_feed_boot"       # телеграм-бот поддержки по фидам

# ── Агентства ──────────────────────────────────────────────────────────────
# phones: обязательно. Яндекс требует российский номер, для агентств прямой
#         номер агента. Номера 880... не принимаются. Без телефона фид собирается,
#         но валидатор помечает его как непригодный к загрузке.
# agent_name: имя менеджера, попадает в <sales-agent><name>.
# category: "агентство" (лоты размещает агентство от своего имени).
# utm_source: добавляется к ссылке на лот, чтобы видеть трафик от агентства
#             (utm_campaign = key ЖК).
# projects: список key ЖК для агентства, например ["optimist", "sezony"].
#           Если не указан, агентство получает фиды по всем ЖК.

