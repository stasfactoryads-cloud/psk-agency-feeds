name: Обновление фидов для агентств

on:
  schedule:
    - cron: '0 9 * * *'        # 09:00 UTC = 12:00 МСК, ежедневно
  workflow_dispatch:           # ручной запуск: Actions -> Run workflow
  push:
    branches: [main]
    paths:                     # пересборка сразу после правки конфига или кода
      - 'config.toml'
      - 'feedgen/**'
      - 'requirements.txt'

concurrency:
  group: update-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Сборка фидов
        run: python -m feedgen build

      - name: Аудит фидов
        # при ошибке аудита job падает, коммита нет, в интернете остается прошлая версия
        run: python -m feedgen audit

      - name: Загрузка на хостинг REG.RU
        if: ${{ secrets.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          FTP_TLS: "1"
        run: python -m feedgen deploy

      - name: Публикация
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs cache
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          LOTS=$(python -c "import json;d=json.load(open('docs/status.json'));print(sum(p['lots'] for p in d['projects']))")
          git commit -m "Фиды обновлены: ${LOTS} лотов, $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M МСК')"
          git push
